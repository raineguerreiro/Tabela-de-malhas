<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Servico</title>
    <meta charset="UTF-8"/>
    <th:block th:replace="~{fragments/layout :: estilo}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar('servicos')}"></div>
<div class="main-area">
    <div class="top-bar" th:text="${servico.id} != null ? 'Editar servico' : 'Novo servico'"></div>
    <div class="content">
        <form th:action="@{/servicos/salvar}" th:object="${servico}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Nome</label>
                    <input type="text" th:field="*{nome}" placeholder="Ex.: Compra de Fio, Tecelagem, Tingimento e Acabamento, Estamparia" required/>
                </div>

                <div class="form-group">
                    <label>Ordem no fluxo</label>
                    <input type="number" th:field="*{ordemFluxo}"/>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
