<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fornecedor</title>
    <meta charset="UTF-8"/>
    <th:block th:replace="~{fragments/layout :: estilo}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar('fornecedores')}"></div>
<div class="main-area">
    <div class="top-bar" th:text="${fornecedor.id} != null ? 'Editar fornecedor' : 'Novo fornecedor'"></div>
    <div class="content">
        <form th:action="@{/fornecedores/salvar}" th:object="${fornecedor}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-grid">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" th:field="*{nome}" required/>
                </div>

                <div class="form-group full-width">
                    <label class="checkbox-label"><input type="checkbox" th:field="*{ativo}" style="width:auto;"/> Ativo</label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
