spring.application.name=projeto_padrao
server.port=8082

# Banco de dados local da aplicacao (H2, persistido em arquivo)
spring.datasource.url=jdbc:h2:file:./data/malhas
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload da planilha de Tingimentos (default do Spring e' 1MB, insuficiente).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Console H2 para inspecao durante o desenvolvimento (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datasource do ERP (segundo banco, somente leitura) - descomentar e preencher quando os
# dados de conexao forem conhecidos. Enquanto ausente, a integracao com o ERP fica desativada.
